<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Assistant</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --faint: #6e7681;
    --you-bg: #1c3b66; --you-border: #2f6fce; --ai-bg: #1b2a22; --ai-border: #2ea043;
    --accent: #58a6ff; --companion: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .side { height: 100vh; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column;
    background: var(--panel); min-height: 0; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  header .title { font-weight: 600; flex: 1; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 2px 9px; cursor: pointer; font: inherit; }
  header button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(88,166,255,.12); }

  .status { font-size: 12px; color: var(--muted); padding: 0 10px; min-height: 0; }
  .status:not(:empty) { padding: 4px 10px; border-bottom: 1px solid var(--border); }
  .status.busy { color: var(--warn); }
  .status { display: flex; flex-direction: column; }
  .status .think { display: block; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl; text-align: left; }

  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .feed.no-chat .c, .feed.no-journal .j { display: none; }

  .msg { border-radius: 10px; padding: 6px 10px 8px; max-width: 92%; word-wrap: break-word; }
  .msg .who { font-size: 11px; font-weight: 600; letter-spacing: .02em; margin-bottom: 2px; }
  .msg .who time { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .msg.user { align-self: flex-end; background: var(--you-bg); border: 1px solid var(--you-border); }
  .msg.user .who { color: #9ecbff; text-align: right; }
  .msg.assistant { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--ai-border);
    border-left-width: 4px; }
  .msg.assistant .who { color: var(--companion); }
  .msg.pending { opacity: .8; }
  .note { align-self: center; color: var(--muted); font-size: 12px; font-style: italic; }

  .body p { margin: 0 0 6px; } .body p:last-child { margin-bottom: 0; }
  .body ul, .body ol { margin: 2px 0 6px; padding-left: 20px; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 14px; margin: 8px 0 4px; }
  .body code { font: 12px ui-monospace, monospace; background: rgba(110,118,129,.25); padding: 1px 4px; border-radius: 4px; }
  .body pre { background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 6px; overflow-x: auto; margin: 4px 0; }
  .body pre code { background: none; padding: 0; }
  .body table { border-collapse: collapse; margin: 4px 0 6px; font-size: 12px; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--border); padding: 2px 6px; text-align: left; }
  .body th { background: rgba(110,118,129,.18); }

  .tool { align-self: flex-start; max-width: 92%; font: 12px/1.4 ui-monospace, monospace; color: var(--muted);
    border-left: 3px solid var(--faint); padding: 2px 8px; cursor: pointer; margin-left: 6px; }
  .tool.pending { color: var(--warn); }
  .tool .out { display: none; margin-top: 4px; max-height: 320px; overflow: auto; color: var(--text);
    white-space: pre; background: rgba(0,0,0,.3); padding: 6px; border-radius: 4px; }
  .tool.open .out { display: block; }

  .jl { font: 12px/1.35 ui-monospace, monospace; color: var(--faint); white-space: pre-wrap; padding-left: 4px; }
  .jl .actor { font-weight: 600; }
  .jl.by-player .actor { color: var(--accent); }
  .jl.by-assistant .actor, .jl.by-companion .actor { color: var(--companion); }
  .jl.by-game .actor { color: var(--muted); }
  .jl .gt { color: #484f58; }

  form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; height: 60px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; }
  form button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 0 14px; cursor: pointer; font: inherit; }
  form button#stop { background: #b62324; }
  header .title .warn { color: var(--warn); font-weight: 400; margin-left: 6px; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 0; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog form { display: block; padding: 16px; border: 0; }
  dialog h2 { font-size: 15px; margin: 0 0 12px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  dialog input[type=text], dialog input[type=password], dialog input[type=number] { width: 100%; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; }
  dialog .row { display: flex; gap: 6px; align-items: center; }
  dialog .row input[type=range] { flex: 1; }
  dialog .row input[type=number] { width: 90px; }
  dialog select { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  dialog #sModel { margin-top: 6px; }
  dialog .row button { white-space: nowrap; }
  dialog .hint { font-size: 12px; color: var(--faint); margin-top: 3px; }
  dialog .msg-line { font-size: 12px; min-height: 18px; margin-top: 10px; }
  dialog .msg-line.error { color: #f85149; } dialog .msg-line.ok { color: var(--companion); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog button { border: 1px solid var(--border); background: none; color: var(--text); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font: inherit; }
  dialog button.primary { background: #238636; border-color: #238636; color: #fff; }
</style>
</head>
<body>
  <main class="side">
    <header>
      <span class="title">Aurora Assistant</span>
      <button id="showChat" aria-pressed="true" title="Show chat messages">Chat</button>
      <button id="showJournal" aria-pressed="true" title="Show game journal">Journal</button>
      <button id="clear" title="Clear the chat and journal: the assistant starts with a fresh context">Clear</button>
      <button id="openSettings" title="Model settings">Settings</button>
    </header>
    <div class="status" id="status"></div>
    <div class="feed" id="feed"></div>
    <form id="send">
      <textarea id="text" placeholder="Message the assistant… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="sendBtn">Send</button>
      <button id="stop" type="button" title="Stop the assistant (also stops the model)" hidden>Stop</button>
    </form>
  </main>

<dialog id="settings">
  <form id="settingsForm" method="dialog">
    <h2>Model settings</h2>
    <label for="sBase">Endpoint (OpenAI-compatible server)</label>
    <input type="text" id="sBase" placeholder="http://localhost:1234" autocomplete="off">
    <div class="hint">LM Studio http://localhost:1234 · Ollama http://localhost:11434 · llama.cpp http://localhost:8080 · OpenRouter https://openrouter.ai/api (try adding /v1)</div>
    <label for="sKey">API key</label>
    <input type="password" id="sKey" autocomplete="off">
    <div class="hint" id="sKeyHint">Only needed for hosted services.</div>
    <label for="sModel">Model</label>
    <div class="row">
      <select id="sModelSelect"></select>
      <button type="button" id="sLoad" title="Load the server's model list (also tests the connection)">Load models</button>
    </div>
    <input type="text" id="sModel" placeholder="Model name as the server knows it" autocomplete="off" hidden>
    <label for="sTemp">Temperature</label>
    <div class="row">
      <input type="range" id="sTempRange" min="0" max="2" step="0.05">
      <input type="number" id="sTemp" min="0" max="2" step="0.05">
    </div>
    <label for="sMax">Max tokens per reply</label>
    <input type="number" id="sMax" min="0" step="256">
    <div class="hint">Includes the model's reasoning. 0 = the server's default.</div>
    <div class="msg-line" id="sMsg"></div>
    <div class="actions">
      <button type="button" id="sCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<script>
function showModel(llm) {
  const t = document.querySelector('header .title');
  t.textContent = 'Aurora Assistant';
  if (!llm) t.append(el('span', 'warn', 'no model configured — open Settings'));
}
fetch('/api/config').then(r => r.json()).then(c => showModel(c.llm));

// ---- Model settings -----------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const dlg = $('settings');
function sMsg(text, cls) { $('sMsg').textContent = text; $('sMsg').className = 'msg-line ' + (cls || ''); }

$('openSettings').onclick = async () => {
  const s = await (await fetch('/api/settings')).json();
  $('sBase').value = s.llm_base_url;
  savedModel = s.llm_model;
  fillModels([], savedModel);
  $('sTemp').value = $('sTempRange').value = s.llm_temperature;
  $('sMax').value = s.llm_max_tokens;
  $('sKey').value = '';
  $('sKey').placeholder = s.has_api_key ? 'saved — leave blank to keep' : '';
  $('sKeyHint').textContent = s.has_api_key ? 'A key is saved. Type a new one to replace it.' : 'Only needed for hosted services.';
  sMsg(s.env_overridden.length
    ? `Set by environment variables, so saved values won't survive a restart: ${s.env_overridden.join(', ')}` : '',
    s.env_overridden.length ? 'error' : '');
  dlg.showModal();
  if (s.llm_base_url) loadModels(true);
};
$('sCancel').onclick = () => dlg.close();
$('sTempRange').oninput = () => { $('sTemp').value = $('sTempRange').value; };
$('sTemp').oninput = () => { $('sTempRange').value = $('sTemp').value; };
// The model is chosen from a real drop-down: the server's models, the saved model (even if the server
// does not list it) and "Other…" for typing a name by hand.
const OTHER = '\u0000other';
let savedModel = '';
function fillModels(models, current) {
  const sel = $('sModelSelect');
  const opts = [...models];
  const keepCurrent = current && !models.includes(current) && !(models.length && current === 'local');
  if (keepCurrent) opts.unshift(current);
  sel.replaceChildren(...opts.map(m => {
    const o = el('option', '', m + (keepCurrent && m === current ? (models.length ? '  (saved, not listed by the server)' : '') : ''));
    o.value = m; return o;
  }));
  const other = el('option', '', 'Other… (type a name)'); other.value = OTHER; sel.append(other);
  sel.value = opts.includes(current) ? current : (opts[0] ?? OTHER);
  $('sModel').value = '';
  $('sModel').hidden = sel.value !== OTHER;
}
$('sModelSelect').onchange = () => {
  $('sModel').hidden = $('sModelSelect').value !== OTHER;
  if (!$('sModel').hidden) $('sModel').focus();
};
function chosenModel() {
  return $('sModelSelect').value === OTHER ? $('sModel').value.trim() : $('sModelSelect').value;
}
async function loadModels(quiet) {
  sMsg('Contacting the server…');
  const q = new URLSearchParams({ base_url: $('sBase').value.trim() });
  if ($('sKey').value) q.set('api_key', $('sKey').value);
  const r = await fetch('/api/models?' + q);
  const d = await r.json();
  if (!r.ok) return sMsg((quiet ? 'Server not reachable: ' : 'Could not load models: ') + d.error, 'error');
  const current = $('sModelSelect').value === OTHER ? ($('sModel').value.trim() || savedModel) : $('sModelSelect').value;
  fillModels(d.models, current);
  sMsg(`Connected: ${d.models.length} model${d.models.length === 1 ? '' : 's'} available.`, 'ok');
}
$('sLoad').onclick = () => loadModels(false);
$('settingsForm').onsubmit = async ev => {
  ev.preventDefault();
  const body = {
    llm_base_url: $('sBase').value.trim(), llm_model: chosenModel(),
    llm_temperature: $('sTemp').value, llm_max_tokens: $('sMax').value || 0,
  };
  if (!body.llm_model) return sMsg('Choose a model (or type one under Other…).', 'error');
  if ($('sKey').value) body.llm_api_key = $('sKey').value;
  const r = await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return sMsg(d.error, 'error');
  dlg.close();
};

const feed = document.getElementById('feed');
const statusEl = document.getElementById('status');
const seen = new Set();
let streaming = null;
let reasoning = '';

// ---- Feed: one chronological timeline of chat and journal -------------------------------------

function atBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80; }

/** Insert a node in time order (items mostly arrive in order, so scan from the end). */
function place(node, t) {
  node.dataset.t = t;
  const stick = atBottom();
  let after = feed.lastElementChild;
  while (after && after !== streaming && Number(after.dataset.t) > t) after = after.previousElementSibling;
  if (streaming && after === streaming) after = streaming.previousElementSibling;
  if (after) after.after(node); else feed.prepend(node);
  if (streaming) feed.append(streaming);
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function bubble(role, content, t) {
  const d = el('div', 'msg c ' + role);
  const who = el('div', 'who', role === 'user' ? 'You' : 'Assistant');
  who.append(el('time', '', clock(t)));
  const body = el('div', 'body');
  body.innerHTML = markdown(content || '');
  d.append(who, body);
  return d;
}

function addChat(m) {
  if (seen.has('c' + m.id)) return;
  seen.add('c' + m.id);
  if (streaming && m.role === 'assistant') { streaming.remove(); streaming = null; }
  if (m.role === 'user' || (m.role === 'assistant' && m.content)) place(bubble(m.role, m.content, m.time), m.time);
  if (m.role === 'note') place(el('div', 'note c', m.content), m.time);
  if (m.role === 'assistant') {
    for (const c of m.tool_calls || []) {
      const d = el('div', 'tool c pending', `▸ ${c.function.name}(${fmtArgs(c.function.arguments)})`);
      d.dataset.call = c.id;
      d.onclick = () => d.classList.toggle('open');
      place(d, m.time + 0.0001);
    }
  }
  if (m.role === 'tool') {
    let d = [...feed.querySelectorAll('.tool')].find(x => x.dataset.call === m.tool_call_id);
    if (!d) { d = el('div', 'tool c', `▸ ${m.name}`); d.onclick = () => d.classList.toggle('open'); place(d, m.time); }
    d.classList.remove('pending');
    d.firstChild.textContent += '  → ' + summary(m.content);
    d.append(el('div', 'out', m.content));
  }
}

function addJournal(e) {
  if (seen.has('j' + e.id)) return;
  seen.add('j' + e.id);
  const d = el('div', 'jl j by-' + e.actor);
  d.append(el('span', 'actor', e.actor), document.createTextNode(' ' + e.text));
  if (e.game_time) d.title = e.game_time;
  place(d, e.time);
}

function summary(s) {
  try { const o = JSON.parse(s); if (o.status) return o.status + (o.error ? ': ' + o.error : ''); if (o.ok) return 'ok'; } catch {}
  const first = (s || '').split('\n')[0];
  return first.length > 60 ? first.slice(0, 60) + '…' : first;
}
function fmtArgs(a) {
  try { return Object.entries(JSON.parse(a || '{}')).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', '); } catch { return a; }
}

// ---- Minimal markdown (the model writes bold, lists, tables, code) -----------------------------

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); i++; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      let html = '<table>';
      body.forEach((r, n) => { const t = n === 0 && rows.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(rows[1]) ? 'th' : 'td';
        html += '<tr>' + cells(r).map(c => `<${t}>${inline(c)}</${t}>`).join('') + '</tr>'; });
      out.push(html + '</table>'); continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      out.push(`<${ordered ? 'ol' : 'ul'}>` + items.map(x => `<li>${inline(x)}</li>`).join('') + `</${ordered ? 'ol' : 'ul'}>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i]); i++) para.push(lines[i]);
    if (!para.length) { para.push(line); i++; }
    out.push('<p>' + para.map(inline).join('<br>') + '</p>');
  }
  return out.join('');
}

// ---- Status, streaming, filters ---------------------------------------------------------------

function setBusy(b) {
  document.getElementById('stop').hidden = !b;
  reasoning = '';
  statusEl.textContent = b ? 'Assistant is working…' : '';
  statusEl.classList.toggle('busy', b);
}
function showReasoning(t) {
  reasoning = (reasoning + t).slice(-300);
  statusEl.textContent = 'Assistant is thinking…';
  const s = el('span', 'think');
  const bdi = document.createElement('bdi'); bdi.textContent = reasoning.replace(/\s+/g, ' ');
  s.append(bdi); statusEl.append(s);
}
function streamDelta(t) {
  const stick = atBottom();
  if (!streaming) {
    streaming = bubble('assistant', '', Date.now() / 1000);
    streaming.classList.add('pending');
    streaming.dataset.raw = '';
    feed.append(streaming);
  }
  streaming.dataset.raw += t;
  streaming.querySelector('.body').innerHTML = markdown(streaming.dataset.raw);
  if (stick) feed.scrollTop = feed.scrollHeight;
}
function dropStreaming() { if (streaming) { streaming.remove(); streaming = null; } }

function toggle(button, cls) {
  const on = button.getAttribute('aria-pressed') !== 'true';
  button.setAttribute('aria-pressed', on);
  feed.classList.toggle(cls, !on);
  feed.scrollTop = feed.scrollHeight;
  try { localStorage.setItem(cls, on ? '1' : '0'); } catch {}
}
for (const [id, cls] of [['showChat', 'no-chat'], ['showJournal', 'no-journal']]) {
  const b = document.getElementById(id);
  b.onclick = () => toggle(b, cls);
  try { if (localStorage.getItem(cls) === '0') toggle(b, cls); } catch {}
}

// ---- Data -------------------------------------------------------------------------------------

async function load() {
  const h = await (await fetch('/api/history')).json();
  h.chat.forEach(addChat);
  h.journal.forEach(addJournal);
  setBusy(h.busy);
  feed.scrollTop = feed.scrollHeight;
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'chat') addChat(m.message);
    else if (m.type === 'journal') addJournal(m.entry);
    else if (m.type === 'status') setBusy(m.busy);
    else if (m.type === 'reasoning') showReasoning(m.text);
    else if (m.type === 'thinking') { reasoning = ''; dropStreaming(); }
    else if (m.type === 'delta') streamDelta(m.text);
    else if (m.type === 'discard') dropStreaming();
    else if (m.type === 'settings') showModel(m.llm);
    else if (m.type === 'cleared') { streaming = null; feed.replaceChildren(); seen.clear(); }
  };
  es.onerror = () => { es.close(); setTimeout(() => { load(); connect(); }, 3000); };
}

document.getElementById('send').onsubmit = async ev => {
  ev.preventDefault();
  const t = document.getElementById('text');
  const text = t.value.trim();
  if (!text) return;
  t.value = '';
  const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  if (r.ok) addChat(await r.json());
};
document.getElementById('clear').onclick = async () => {
  if (!confirm('Clear the chat and journal for everyone? The assistant will start with a fresh context.')) return;
  await fetch('/api/clear', { method: 'POST' });
};
document.getElementById('stop').onclick = async () => {
  await fetch('/api/stop', { method: 'POST' });
  dropStreaming();
};
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !document.getElementById('stop').hidden) document.getElementById('stop').click();
});
document.getElementById('text').onkeydown = ev => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); document.getElementById('send').requestSubmit(); }
};

load().then(connect);
</script>
</body>
</html>
