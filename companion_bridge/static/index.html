<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Companion</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --player: #1f6feb; --companion: #238636; --tool: #6e7681; --accent: #58a6ff; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display: flex; height: 100vh; }
  .game { flex: 1; min-width: 0; background: #000; }
  .game iframe { width: 100%; height: 100%; border: 0; display: block; }
  .side { width: 400px; display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--border); }
  .side.collapsed { width: 36px; }
  .side.collapsed > :not(header) { display: none; }
  .side.collapsed header .title, .side.collapsed header .tabs { display: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  header .title { font-weight: 600; flex: 1; }
  header button, .tabs button { background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; }
  .tabs button.on { color: var(--text); border-color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); padding: 4px 10px; min-height: 22px; }
  .status.busy { color: var(--warn); }
  .status .think { display: block; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl; text-align: left; }
  .feed { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: rgba(31,111,235,.18); border: 1px solid rgba(31,111,235,.4); align-self: flex-end; max-width: 90%; }
  .msg.assistant { background: rgba(35,134,54,.14); border: 1px solid rgba(35,134,54,.4); }
  .msg.note { color: var(--muted); font-style: italic; font-size: 12px; background: none; padding: 0 4px; }
  .msg.tool { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); background: rgba(110,118,129,.12);
    border-left: 3px solid var(--tool); cursor: pointer; }
  .msg.tool .out { display: none; margin-top: 4px; max-height: 300px; overflow: auto; color: var(--text); }
  .msg.tool.open .out { display: block; }
  .msg.pending { opacity: .75; }
  .journal .line { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); }
  .journal .line .who { font-weight: 600; }
  .journal .line.player .who { color: var(--accent); }
  .journal .line.companion .who { color: #3fb950; }
  form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; height: 60px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; }
  form button { background: var(--companion); color: #fff; border: 0; border-radius: 6px; padding: 0 14px; cursor: pointer; font: inherit; }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .game { flex: none; height: 55vh; }
    .side, .side.collapsed { width: 100%; flex: 1; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="game"><iframe id="vnc" title="Aurora desktop"></iframe></div>
  <aside class="side" id="side">
    <header>
      <span class="title">Companion</span>
      <div class="tabs">
        <button data-view="chat" class="on">Chat</button>
        <button data-view="journal">Journal</button>
      </div>
      <button id="collapse" title="Collapse">⇥</button>
    </header>
    <div class="status" id="status"></div>
    <div class="feed" id="chat"></div>
    <div class="feed journal" id="journal" hidden></div>
    <form id="send">
      <textarea id="text" placeholder="Message the companion… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button>Send</button>
    </form>
  </aside>
</div>
<script>
const vncUrl = '/novnc/vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=2000&show_dot=1&path=websockify';
document.getElementById('vnc').src = vncUrl;

const chatEl = document.getElementById('chat');
const journalEl = document.getElementById('journal');
const statusEl = document.getElementById('status');
const seen = new Set();
let streaming = null;
let reasoning = '';

function atBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 60; }
function stick(el, f) { const b = atBottom(el); f(); if (b) el.scrollTop = el.scrollHeight; }

function addChat(m) {
  if (seen.has('c' + m.id)) return;
  seen.add('c' + m.id);
  stick(chatEl, () => {
    if (streaming) { streaming.remove(); streaming = null; }
    if (m.role === 'assistant') {
      if (m.content) chatEl.append(el('div', 'msg assistant', m.content));
      for (const c of m.tool_calls || []) {
        const d = el('div', 'msg tool pending', `▸ ${c.function.name}(${fmtArgs(c.function.arguments)})`);
        d.dataset.call = c.id;
        d.onclick = () => d.classList.toggle('open');
        chatEl.append(d);
      }
    } else if (m.role === 'tool') {
      const d = [...chatEl.querySelectorAll('.msg.tool')].find(x => x.dataset.call === m.tool_call_id);
      const target = d || chatEl.appendChild(el('div', 'msg tool', `▸ ${m.name}`));
      target.classList.remove('pending');
      target.firstChild.textContent += '  → ' + summary(m.content);
      const out = el('div', 'out', m.content);
      target.append(out);
      target.onclick = () => target.classList.toggle('open');
    } else {
      chatEl.append(el('div', 'msg ' + m.role, m.content));
    }
  });
}

function addJournal(e) {
  if (seen.has('j' + e.id)) return;
  seen.add('j' + e.id);
  stick(journalEl, () => {
    const d = el('div', 'line ' + e.actor, '');
    const who = el('span', 'who', e.actor);
    d.append(who, document.createTextNode(': ' + e.text));
    journalEl.append(d);
  });
}

function summary(s) {
  try { const o = JSON.parse(s); if (o.status) return o.status + (o.error ? ': ' + o.error : ''); if (o.ok) return 'ok'; } catch {}
  const first = (s || '').split('\n')[0];
  return first.length > 60 ? first.slice(0, 60) + '…' : first;
}
function fmtArgs(a) {
  try { return Object.values(JSON.parse(a || '{}')).map(v => JSON.stringify(v)).join(', '); } catch { return a; }
}
function el(tag, cls, text) { const e = document.createElement(tag); e.className = cls; if (text) e.textContent = text; return e; }

function setBusy(b) {
  reasoning = '';
  statusEl.textContent = b ? 'Companion is working…' : '';
  statusEl.classList.toggle('busy', b);
}
function showReasoning(t) {
  reasoning = (reasoning + t).slice(-300);
  statusEl.textContent = 'Companion is thinking…';
  const s = el('span', 'think', '');
  // Show the tail of the thought; bdi keeps punctuation in order inside the rtl ellipsis trick.
  const bdi = document.createElement('bdi'); bdi.textContent = reasoning.replace(/\s+/g, ' ');
  s.append(bdi); statusEl.append(s);
}

async function load() {
  const h = await (await fetch('/api/history')).json();
  h.chat.forEach(addChat);
  h.journal.forEach(addJournal);
  setBusy(h.busy);
  chatEl.scrollTop = chatEl.scrollHeight;
  journalEl.scrollTop = journalEl.scrollHeight;
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'chat') addChat(m.message);
    else if (m.type === 'journal') addJournal(m.entry);
    else if (m.type === 'status') setBusy(m.busy);
    else if (m.type === 'reasoning') showReasoning(m.text);
    else if (m.type === 'thinking') { reasoning = ''; if (streaming) { streaming.remove(); streaming = null; } }
    else if (m.type === 'delta') stick(chatEl, () => {
      if (!streaming) { streaming = el('div', 'msg assistant pending', ''); chatEl.append(streaming); }
      streaming.textContent += m.text;
    });
    else if (m.type === 'discard') { if (streaming) { streaming.remove(); streaming = null; } }
  };
  es.onerror = () => { es.close(); setTimeout(() => { load(); connect(); }, 3000); };
}

document.getElementById('send').onsubmit = async ev => {
  ev.preventDefault();
  const t = document.getElementById('text');
  const text = t.value.trim();
  if (!text) return;
  t.value = '';
  const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  if (r.ok) addChat(await r.json());
};
document.getElementById('text').onkeydown = ev => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); document.getElementById('send').requestSubmit(); }
};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  chatEl.hidden = b.dataset.view !== 'chat';
  journalEl.hidden = b.dataset.view !== 'journal';
});
document.getElementById('collapse').onclick = () => document.getElementById('side').classList.toggle('collapsed');

load().then(connect);
</script>
</body>
</html>
