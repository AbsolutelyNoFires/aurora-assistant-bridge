[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-assistant-bridge"
version = "0.2.1"
description = "LLM assistant for Aurora 4X: web chat and MCP server over the Aurora Assistant API patch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "mcp>=2.2,<3",
]

[project.scripts]
aurora-assistant = "aurora_assistant_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aurora_assistant_bridge = ["static/*"]
